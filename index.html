<title>Cue</title>
<style>
  :root{
    --bg:#0A0B0D; --surface:#141518; --surface2:#1C1E22; --line:#2B2E35;
    --text:#F4F5F7; --muted:#8B909A; --amber:#F0B64A; --amber-soft:rgba(240,182,74,.16);
    --rec:#FF3B30;
    --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased}
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:var(--font); color:var(--text)}
  button{font-family:var(--font)}

  #app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000}
  #stage{position:relative; height:100dvh; aspect-ratio:9/16; max-width:100vw; background:#000; overflow:hidden}
  canvas{width:100%; height:100%; display:block}

  /* ===== Teleprompter overlay (reading guide, not recorded) ===== */
  #teleWrap{position:absolute; left:0; right:0; overflow:hidden; pointer-events:none; z-index:4}
  #teleWrap.shaded{background:linear-gradient(to bottom,transparent,rgba(0,0,0,.55) 14%,rgba(0,0,0,.55) 86%,transparent)}
  #teleText{position:absolute; top:0; left:0; right:0; padding:0 8%; text-align:center;
    color:#fff; font-weight:650; line-height:1.34; letter-spacing:.2px; white-space:normal; word-wrap:break-word;
    text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.85); will-change:transform}
  #teleText .w.cur{color:var(--amber)}
  /* the amber "cue line" — where your eyes should rest */
  #cueLine{position:absolute; left:6%; right:6%; top:30%; height:0;
    border-top:1.5px solid rgba(240,182,74,.55); box-shadow:0 0 12px rgba(240,182,74,.35); pointer-events:none}
  #cueLine::before,#cueLine::after{content:""; position:absolute; top:-7px; width:2px; height:14px; background:var(--amber); border-radius:2px; box-shadow:0 0 8px rgba(240,182,74,.6)}
  #cueLine::before{left:-2px} #cueLine::after{right:-2px}

  /* ===== Start screen ===== */
  #startScreen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:32px; text-align:center; z-index:10;
    background:radial-gradient(120% 80% at 50% 30%, #1a1c22 0%, #0b0c0e 55%, #08090b 100%)}
  #startScreen .logo{width:96px; height:96px; border-radius:24px; box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05); margin-bottom:26px}
  #startScreen .brand{font-size:40px; font-weight:700; letter-spacing:1px; margin:0}
  #startScreen .brand em{font-style:normal; color:var(--amber)}
  #startScreen .tag{font-size:15px; color:var(--muted); margin:10px 0 34px; line-height:1.5; max-width:290px}
  #startBtn{background:var(--amber); color:#151007; border:none; border-radius:16px; padding:17px 40px; font-size:17px; font-weight:700; letter-spacing:.3px;
    box-shadow:0 10px 30px rgba(240,182,74,.28); transition:transform .06s, filter .15s}
  #startBtn:active{transform:scale(.97)}
  #startScreen .priv{font-size:12px; color:#5c616b; margin-top:26px; display:flex; align-items:center; gap:6px}

  /* ===== Top bar ===== */
  #topbar{position:absolute; top:0; left:0; right:0; height:calc(var(--safe-t) + 60px); display:flex; align-items:flex-end; justify-content:space-between; padding:0 16px 8px; z-index:6; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.45), transparent)}
  .wordmark{font-size:17px; font-weight:700; letter-spacing:.5px; color:#fff; opacity:.9; text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .wordmark em{font-style:normal; color:var(--amber)}
  #recBadge{display:none; align-items:center; gap:7px; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); padding:6px 13px; border-radius:999px; font-size:13.5px; font-weight:700; letter-spacing:.5px}
  #recBadge .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .iconbtn{pointer-events:auto; width:42px; height:42px; border-radius:50%; border:none; background:rgba(20,21,24,.55); backdrop-filter:blur(8px); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center}
  .iconbtn:active{transform:scale(.94)}

  /* ===== Bottom controls ===== */
  #controls{position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding:20px 34px calc(var(--safe-b) + 26px); z-index:6;
    background:linear-gradient(to top, rgba(0,0,0,.5), transparent)}
  #recordBtn{width:78px; height:78px; border-radius:50%; border:4px solid rgba(255,255,255,.92); background:transparent; display:flex; align-items:center; justify-content:center; padding:0}
  #recordBtn::before{content:""; width:62px; height:62px; border-radius:50%; background:var(--rec); transition:all .18s ease}
  #recordBtn.recording::before{width:30px; height:30px; border-radius:8px}
  #recordBtn:active{transform:scale(.95)}
  .sidebtn{width:56px; height:56px; border-radius:18px; border:none; background:rgba(20,21,24,.55); backdrop-filter:blur(10px); color:#fff; font-size:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
  .sidebtn small{font-size:9.5px; color:var(--muted); font-weight:600; letter-spacing:.3px}
  .sidebtn:active{transform:scale(.94)}

  /* ===== Settings sheet ===== */
  #sheetOverlay{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:19; display:none}
  #sheetOverlay.open{display:block}
  #sheet{position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:26px 26px 0 0; z-index:20;
    padding:12px 18px calc(var(--safe-b) + 18px); transform:translateY(103%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    max-height:90dvh; overflow-y:auto; box-shadow:0 -20px 50px rgba(0,0,0,.5)}
  #sheet.open{transform:translateY(0)}
  .grab{width:38px; height:5px; border-radius:3px; background:#3a3e46; margin:0 auto 14px}
  .sheet-title{font-size:20px; font-weight:700; letter-spacing:.4px; margin:0 4px 16px}
  .sheet-title em{font-style:normal; color:var(--amber)}
  .card{background:var(--surface2); border:1px solid rgba(255,255,255,.04); border-radius:16px; padding:14px; margin-bottom:12px}
  .lbl{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.7px; margin:0 0 9px}
  textarea{width:100%; min-height:120px; background:#101116; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:13px; font-size:16px; line-height:1.5; font-family:var(--font); resize:vertical}
  .rangeRow{display:flex; align-items:center; gap:14px}
  input[type=range]{flex:1; accent-color:var(--amber); height:28px}
  .chip{font-variant-numeric:tabular-nums; min-width:48px; text-align:center; font-weight:700; font-size:13px; color:var(--amber); background:var(--amber-soft); border-radius:8px; padding:5px 0}
  .seg{display:flex; gap:6px; background:#101116; border-radius:12px; padding:5px}
  .seg button{flex:1; background:transparent; color:var(--muted); border:none; border-radius:9px; padding:10px; font-size:13.5px; font-family:var(--font); font-weight:600}
  .seg button.on{background:var(--surface2); color:var(--amber); box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .switch{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; font-size:14.5px; color:var(--text); border-top:1px solid rgba(255,255,255,.05)}
  .switch:first-child{border-top:none}
  .switch span{flex:1}
  .switch input[type=checkbox]{appearance:none; -webkit-appearance:none; width:48px; height:29px; border-radius:999px; background:#33373f; position:relative; flex:0 0 auto; transition:background .2s; margin:0}
  .switch input[type=checkbox]::after{content:""; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .switch input[type=checkbox]:checked{background:var(--amber)}
  .switch input[type=checkbox]:checked::after{transform:translateX(19px)}
  #doneBtn{width:100%; margin-top:4px; background:var(--amber); color:#151007; border:none; border-radius:15px; padding:16px; font-size:16px; font-weight:700; letter-spacing:.3px}
  #doneBtn:active{transform:scale(.98)}

  /* ===== Countdown ===== */
  #countdown{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:120px; font-weight:300; background:rgba(0,0,0,.3); z-index:7; color:#fff; text-shadow:0 4px 40px rgba(0,0,0,.6)}

  /* ===== Result screen ===== */
  #result{position:fixed; inset:0; background:var(--bg); z-index:40; display:none; flex-direction:column}
  #result .rhead{flex:0 0 auto; text-align:center; padding:calc(var(--safe-t) + 14px) 0 10px; font-size:16px; font-weight:700; letter-spacing:.4px}
  #result .rhead em{font-style:normal; color:var(--amber)}
  #result video{flex:1 1 auto; min-height:0; width:100%; object-fit:contain; background:#000}
  #resultBar{flex:0 0 auto; padding:16px 18px calc(var(--safe-b) + 20px); display:flex; flex-direction:column; gap:12px; background:var(--surface); border-radius:24px 24px 0 0}
  #resultBar .note{font-size:12.5px; color:var(--muted); line-height:1.5; text-align:center}
  #resultBar .btns{display:flex; gap:10px}
  #shareBtn{flex:2; background:var(--amber); color:#151007; font-weight:800; border:none; border-radius:15px; padding:17px; font-size:16px; letter-spacing:.3px}
  #shareBtn:active{transform:scale(.98)}
  #redoBtn{flex:1; background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:15px; padding:17px; font-size:15px; font-weight:600}
  #saveBtn{display:block; text-align:center; text-decoration:none; color:#5c616b; font-size:13px; padding:2px}

  #toast{position:absolute; bottom:130px; left:50%; transform:translateX(-50%); background:rgba(20,21,24,.9); backdrop-filter:blur(10px); padding:10px 16px; border-radius:12px; font-size:13px; z-index:8; display:none; max-width:82%; text-align:center; border:1px solid rgba(255,255,255,.06)}
</style>

  canvas.width=W; canvas.height=H;

  const FRAC={ top:{t:0.08,h:0.34}, center:{t:0.30,h:0.40}, bottom:{t:0.55,h:0.34} };

  let stream=null, video=null, facing='user';
  let recorder=null, chunks=[], recording=false, recStart=0, timerId=null;
  let scrollPx=0, lastTs=0, pos='center';
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

  speedEl.oninput=()=>speedVal.textContent=speedEl.value;
  sizeEl.oninput =()=>{ sizeVal.textContent=sizeEl.value; applyTextStyle(); };
  zoomEl.oninput =()=>{ zoomVal.textContent = (parseInt(zoomEl.value,10)/100).toFixed(1)+'x'; };

  posSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    posSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); pos=b.dataset.pos; layoutOverlay(); resetScroll();
  });
  shade.onchange=()=>{ teleWrap.classList.toggle('shaded', shade.checked); };
  burnIn.onchange=()=>{ updateOverlayVisibility(); };
  scriptEl.oninput=()=>{ buildOverlay(); resetScroll(); };

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Build the reading text as individual word spans so voice-tracking can find each word's position.
  function buildOverlay(){
    const text=scriptEl.value.replace(/\r/g,''); const paras=text.split('\n');
    let html=''; scriptWords=[]; let idx=0;
    paras.forEach((p,pi)=>{
      const words=p.split(/\s+/).filter(Boolean);
      words.forEach(w=>{
        html+='<span class="w">'+escapeHtml(w)+'</span> ';
        scriptWords.push(w.toLowerCase().replace(/[^\w']/g,''));
        idx++;
      });
      if(pi<paras.length-1) html+='<br><br>';
    });
    teleText.innerHTML=html;
    wordSpans=Array.prototype.slice.call(teleText.querySelectorAll('.w'));
    wordPtr=0;
  }

  function updateOverlayVisibility(){
    // When burning into video, the words are drawn on the canvas instead, so hide the DOM layer.
    teleWrap.style.display = burnIn.checked ? 'none' : 'block';
  }

  function applyTextStyle(){ teleText.style.fontSize = sizeEl.value + 'px'; }

  function dispSize(){ const r=stage.getBoundingClientRect(); return {w:r.width, h:r.height}; }

  function layoutOverlay(){
    const d=dispSize(); const f=FRAC[pos];
    teleWrap.style.top = (d.h*f.t)+'px';
    teleWrap.style.height = (d.h*f.h)+'px';
  }

  // Start the first line already parked at the reading spot so text shows the instant you record.
  function resetScroll(){ const d=dispSize(); scrollPx = d.h*FRAC[pos].h*0.20; applyScroll(); }
  function applyScroll(){ teleText.style.transform='translateY('+scrollPx+'px)'; }

  async function startCamera(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1440}, frameRate:{ideal:30} },
        audio:{ echoCancellation:true, noiseSuppression:true }
      });
    }catch(e){ showToast('Camera/mic blocked: '+e.message,5000); return false; }
    if(!video){ video=document.createElement('video'); video.muted=true; video.playsInline=true; video.setAttribute('playsinline',''); }
    video.srcObject=stream; await video.play();
    try{ const s=stream.getVideoTracks()[0].getSettings(); showToast('Camera feed: '+(s.width||video.videoWidth)+'×'+(s.height||video.videoHeight),4000); }catch(e){}
    return true;
  }

  startBtn.onclick=async ()=>{
    startBtn.disabled=true; startBtn.textContent='Starting…';
    const ok=await startCamera();
    if(!ok){ startBtn.disabled=false; startBtn.textContent='Start'; return; }
    startScreen.style.display='none';
    buildOverlay(); applyTextStyle();
    layoutOverlay(); updateOverlayVisibility(); resetScroll();
    lastTs=0; scheduleDraw();
  };
  window.addEventListener('resize', ()=>{ layoutOverlay(); });

  function flip(){ facing=(facing==='user'?'environment':'user'); startCamera(); }
  flipBtn.onclick=flip; flipBtn2.onclick=flip;

  function openSheet(){ sheet.classList.add('open'); sheetOverlay.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); sheetOverlay.classList.remove('open'); }
  scriptBtn.onclick=openSheet; doneBtn.onclick=closeSheet; sheetOverlay.onclick=closeSheet;

  function showToast(t,ms){ toast.textContent=t; toast.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>toast.style.display='none', ms||2600); }

  function drawCentered(scale, blur){
    const iw=video.videoWidth, ih=video.videoHeight;
    const dw=iw*scale, dh=ih*scale;
    ctx.save();
    if(blur) ctx.filter='blur(22px)';
    if(mirrorCam.checked && facing==='user'){ ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.restore();
  }
  function drawCamera(){
    const iw=video.videoWidth, ih=video.videoHeight; if(!iw) return;
    const cover=Math.max(W/iw, H/ih);   // fills the 9:16 frame edge-to-edge, sharp
    const z=cover*(parseInt(zoomEl.value,10)/100);  // 100% = full-bleed; higher = zoom in
    drawCentered(z, false);
  }

  // Only used when "show words in video" is on.
  function wrapLines(text,maxWidth,fontPx){
    ctx.font=`700 ${fontPx}px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    const paras=text.replace(/\r/g,'').split('\n'); const lines=[];
    for(const p of paras){
      if(p.trim()===''){ lines.push(''); continue; }
      const words=p.split(/\s+/); let cur='';
      for(const w of words){ const test=cur?cur+' '+w:w;
        if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; } else cur=test; }
      if(cur) lines.push(cur);
    }
    return lines;
  }
  function drawBurnText(){
    const d=dispSize(); const r=W/d.w;              // display px -> canvas px
    const f=FRAC[pos]; const regionTop=H*f.t, regionH=H*f.h;
    const fontPx=parseInt(sizeEl.value,10)*r; const lineH=fontPx*1.32; const marginX=W*0.07;
    const lines=wrapLines(scriptEl.value, W-marginX*2, fontPx);
    ctx.save(); ctx.beginPath(); ctx.rect(0,regionTop,W,regionH); ctx.clip();
    if(shade.checked){
      const g=ctx.createLinearGradient(0,regionTop,0,regionTop+regionH);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.12,'rgba(0,0,0,.5)');
      g.addColorStop(.88,'rgba(0,0,0,.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,regionTop,W,regionH);
    }
    ctx.font=`700 ${fontPx}px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=fontPx*0.14;
    let y=regionTop + scrollPx*r;
    for(const ln of lines){ if(y>regionTop-lineH && y<regionTop+regionH+lineH) ctx.fillText(ln,W/2,y); y+=lineH; }
    ctx.restore();
  }

  // Draw in sync with the camera's actual frames (smoother recording, less stutter) where supported.
  function scheduleDraw(){
    if(video && 'requestVideoFrameCallback' in video){
      video.requestVideoFrameCallback(function(now){ drawFrame(now); scheduleDraw(); });
    } else {
      requestAnimationFrame(function(now){ drawFrame(now); scheduleDraw(); });
    }
  }
  function drawFrame(ts){
    if(!video) return;
    const now=ts||performance.now(); if(!lastTs) lastTs=now;
    const dt=Math.min(0.05,(now-lastTs)/1000); lastTs=now;

    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    drawCamera();

    // advance scroll while recording
    if(recording){
      const d=dispSize();
      if(voiceScroll.checked && recog){
        // ease toward the position the voice tracker last matched
        scrollPx += (voiceTargetScroll - scrollPx) * Math.min(1, dt*5);
      } else {
        const speedPx=parseInt(speedEl.value,10)*0.7;   // display px / sec
        scrollPx-=speedPx*dt;
        const textH = burnIn.checked ? 99999 : teleText.offsetHeight;
        const regionH=d.h*FRAC[pos].h;
        if(scrollPx + textH < 0){ scrollPx=regionH; }     // loop long scripts
      }
      applyScroll();
    }

    if(burnIn.checked) drawBurnText();
  }

  // ---- Voice tracking (beta) ----
  function updateVoiceTarget(){
    if(!wordSpans.length) return;
    const i=Math.max(0, Math.min(wordPtr, wordSpans.length-1));
    for(const s of wordSpans) s.classList.remove('cur');
    const span=wordSpans[i]; if(!span) return;
    span.classList.add('cur');
    const regionH=dispSize().h*FRAC[pos].h;
    voiceTargetScroll = regionH*0.28 - span.offsetTop;   // keep the current word near the top of the reading band
  }
  function onVoiceResult(e){
    const idx=e.results.length-1;
    const spoken=(e.results[idx][0].transcript||'').toLowerCase().replace(/[^\w\s']/g,' ').split(/\s+/).filter(Boolean);
    if(idx!==utterIdx){ utterIdx=idx; consumed=0; }   // a new phrase started
    // Walk only the newly-heard words, in order, matching WHOLE words within a small window ahead.
    for(let k=consumed; k<spoken.length; k++){
      const sw=spoken[k];
      for(let j=wordPtr; j<Math.min(wordPtr+6, scriptWords.length); j++){
        if(scriptWords[j]===sw){ wordPtr=j+1; break; }   // exact whole-word match only
      }
    }
    consumed=Math.max(0, spoken.length-1);   // keep the last (still-being-refined) word re-checkable
    updateVoiceTarget();
  }
  function startVoice(){
    if(!SR){ showToast("Your browser can't do voice scrolling — using set speed instead",4000); return; }
    utterIdx=-1; consumed=0;
    try{
      recog=new SR(); recog.continuous=true; recog.interimResults=true; recog.lang='en-US';
      recog.onresult=onVoiceResult;
      recog.onerror=function(){};
      recog.onend=function(){ if(recording && voiceScroll.checked){ try{ recog.start(); }catch(e){} } };
      recog.start();
    }catch(e){ showToast('Voice scrolling could not start: '+e.message,4000); recog=null; }
  }
  function stopVoice(){ if(recog){ try{ recog.onend=null; recog.stop(); }catch(e){} recog=null; } }

  function pickMime(){
    const opts=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(const m of opts){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
    return '';
  }

  function runCountdown(n){
    return new Promise(res=>{ countdownEl.style.display='flex'; let c=n; countdownEl.textContent=c;
      const iv=setInterval(()=>{ c--; if(c<=0){ clearInterval(iv); countdownEl.style.display='none'; res(); } else countdownEl.textContent=c; },1000); });
  }

  recordBtn.onclick=async ()=>{
    if(!stream) return;
    if(!recording){
      recordBtn.disabled=true; closeSheet();
      resetScroll();
      await runCountdown(3);
      const cs=canvas.captureStream(30);
      const a=stream.getAudioTracks()[0]; if(a) cs.addTrack(a);
      chunks=[]; const mime=pickMime();
      try{ recorder=new MediaRecorder(cs, mime?{mimeType:mime,videoBitsPerSecond:16_000_000,audioBitsPerSecond:128_000}:undefined); }
      catch(e){ showToast('Recording not supported: '+e.message,5000); recordBtn.disabled=false; return; }
      recorder._mime=mime||'video/webm';
      recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      recorder.onstop=finalize; recorder.start(200);
      recording=true; recStart=performance.now();
      recordBtn.classList.add('recording'); recordBtn.disabled=false;
      recBadge.style.display='flex'; tick();
      if(voiceScroll.checked){ wordPtr=0; updateVoiceTarget(); startVoice(); }
    } else {
      recording=false; recorder.stop(); stopVoice();
      recordBtn.classList.remove('recording'); recBadge.style.display='none'; clearTimeout(timerId);
    }
  };

  function tick(){ if(!recording) return;
    const s=Math.floor((performance.now()-recStart)/1000);
    recTime.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); timerId=setTimeout(tick,250); }

  function finalize(){
    const type=(recorder._mime||'').indexOf('mp4')>=0?'video/mp4':'video/webm';
    const ext=type==='video/mp4'?'mp4':'webm';
    const blob=new Blob(chunks,{type}); const url=URL.createObjectURL(blob);
    const fname='cue-'+Math.floor(performance.now())+'.'+ext;
    currentFile=new File([blob], fname, {type});
    resultVideo.src=url; saveBtn.href=url; saveBtn.download=fname;
    const mb=(blob.size/1048576).toFixed(1);
    const clean = burnIn.checked ? '' : ' Clean recording — just you, no words on it.';
    const canShare = !!(navigator.canShare && navigator.canShare({files:[currentFile]}));
    if(canShare){
      saveNote.innerHTML='Tap <b>Save / Share</b> → then <b>Save Video</b> to send it to your camera roll, or pick <b>TikTok</b> to post it right away.'+clean+' ('+ext.toUpperCase()+', '+mb+' MB)';
    } else if(isIOS){
      saveNote.innerHTML='Tap the <b>share</b> icon in the player above → <b>Save Video</b> to add it to your camera roll, then open TikTok → + → Upload.'+clean+' ('+ext.toUpperCase()+', '+mb+' MB)';
    } else {
      saveNote.innerHTML='Tap <b>Save / Share</b> (or the download link) to save it, then upload in TikTok.'+clean+' ('+ext.toUpperCase()+', '+mb+' MB)';
    }
    resultEl.style.display='flex';
  }

  shareBtn.onclick=async ()=>{
    if(!currentFile) return;
    if(navigator.canShare && navigator.canShare({files:[currentFile]})){
      try{ await navigator.share({files:[currentFile], title:'My video'}); }
      catch(e){ /* user dismissed the share sheet — no action needed */ }
    } else {
      saveBtn.click(); // fallback: download the file
    }
  };

  redoBtn.onclick=()=>{ resultEl.style.display='none'; resultVideo.pause(); resetScroll(); };
  window.addEventListener('beforeunload',()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); });
})();
</script>
</body>
</html>
